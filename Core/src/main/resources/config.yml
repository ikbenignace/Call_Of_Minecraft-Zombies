config:
  perks:
    # Perks show as HUD potion-effect icons (not inventory slots); BO2 limit is 4, max is the 12 real perks.
    maxPerks: 4
    #Seconds a player cannot fire while drinking a perk.
    drinkLockSeconds: 2.0
    #Quick Revive price in a solo game (BO2: 500). Multiplayer uses the machine's own price.
    soloQuickRevivePrice: 500
    #Zombie hits that down a player holding Juggernog (BO: 5). Set to 0 to use juggernogHealth instead.
    juggernogHitsToDown: 5
    #Juggernog damage divisor on zombie hits, only used when juggernogHitsToDown is 0.
    juggernogHealth: 2.4
    #Deadshot Daiquiri extra headshot damage multiplier, applied on top of the base 1.5x headshot bonus.
    deadshotHeadshotMultiplier: 2.0
    #Speed Cola reload multiplier (0.5 = reload twice as fast). BO2: Speed Cola halves reload.
    speedColaReloadMultiplier: 0.5
    #Double Tap fire-delay divisor (1.5 = fire 1.5x faster). BO2: Double Tap speeds fire rate.
    doubleTapFireMultiplier: 1.5
    #Double Tap damage multiplier per bullet (BO2 Double Tap 2.0: each bullet counts double).
    doubleTapDamageMultiplier: 2.0
    #Stamin-Up walk speed (vanilla 0.2). BO2: about +7-10% walk speed.
    staminUpWalkSpeed: 0.22
    #PhD Flopper: damage dealt to zombies near a landing from a damaging fall (replaces fall damage).
    phdFlopperDamage: 100
    #PhD Flopper: blast radius in blocks.
    phdFlopperRadius: 5.0
    #Tombstone Soda (BO2 rules): a player holding the perk who bleeds out leaves their body behind. After respawning they walk over it to get their perks (minus Tombstone) and guns back. Being revived still loses all perks.
    tombstoneEnabled: true
    #Seconds the tombstone stays once its owner is back in play, before it fades.
    tombstoneLifetime: 90
    #Solo self-revive: number of times Quick Revive auto-revives a lone player in a solo (1-player) game. BO1/BO2 solo behavior.
    soloQuickReviveUses: 3
    #Who's Who: seconds a lone player spends as a ghost to reach their body and self-revive before dying for real (simplified solo approximation; see DownedPlayerManager).
    whosWhoSeconds: 20
    #Who's Who: distance in blocks the ghost must be within of their body location to self-revive.
    whosWhoReviveRange: 3.0
  gameSettings:
    #Range to allow knife attacks. (Values over 6 are set to 6, the vanilla value.)
    MeleeRange: 2
    #Have all or only one Mystery Box be spawned at a time
    MultipleMysteryBoxes: false
    #Double points length in seconds
    doublePointsTimer: 30
    #Insta kill lenght in seconds
    instaKillTimer: 30
    #Insta kill lenght in seconds
    fireSaleTimer: 30
    #Time power-ups stay on the ground in seconds (BO2 ~26.5); they blink for the last 6 seconds.
    perkLife: 26.5
    #Gun Reload time in seconds
    reloadTime: 3
    #Default points when you hit a zombie, value * 2 on double points
    defaultPointsOnHit: 10
    #Default points when you kill a zombie, value * 2 on double points (BO: 60)
    defaultPointsOnKill: 60
    #Maximum wave a game will run before ending automatically. 0 = no cap (games run until players die).
    maxWave: 0
    #Interval (seconds) between round change and the first zombie spawning. 0 = spawn immediately.
    waveSpawnInterval: 0
    #Max possible zombies in an arena at once (legacy; board max is now player-scaled below)
    maxZombies: 20
    #BO2 board capacity: zombies alive at once = zombieBoardBase + zombieBoardPerPlayer*(players-1). BO2 = 24 regardless of player count.
    zombieBoardBase: 24
    zombieBoardPerPlayer: 0
    #BO round count: zombieCountBase + zombieCountPerPlayer*(players-1)*mult (solo: half of zombieCountPerPlayer*mult), mult = max(1, round/5), from round 10 also * round*zombieRoundMultiplier. Rounds 1-5 take 25/30/50/70/90%. Solo r1 = 6, 4 players r1 = 10, r20 = 240.
    zombieCountBase: 24
    zombieCountPerPlayer: 6
    zombieRoundMultiplier: 0.15
    #Spawn delay is divided by this each round (1.0526 = x0.95 per round, BO2).
    zombieSpawnDelayFactor: 1.0526
    #Seconds between zombie spawns on round 1 (BO2: 2). Shrinks every round down to zombieSpawnDelayMin.
    zombieSpawnDelay: 2.0
    #Lowest spawn delay in seconds (BO2 ~0.1).
    zombieSpawnDelayMin: 0.1
    #Global multiplier on the BO round count.
    zombieCountMultiplier: 1.0
    #BO1 speed roll: each zombie rolls round*zombieMoveSpeedPerRound + random(0..zombieMoveSpeedSpread). Up to zombieWalkThreshold it walks, up to zombieRunThreshold it runs, above that it sprints. Defaults: round 1 ~80% walkers, all sprinters from round 9.
    zombieMoveSpeedPerRound: 8
    zombieMoveSpeedSpread: 35
    zombieWalkThreshold: 35
    zombieRunThreshold: 70
    #From this round the last zombie alive in a round sprints (BO). 0 disables.
    lastZombieSprintRound: 4
    #Highest real max health a mob gets (server attribute cap is 2048). Higher BO health is kept by scaling incoming damage.
    zombieHealthCap: 1024
    #Spawn zombies only in arena zones that hold a player or touch one (directly or via an opened door), as in BO. Arenas without zones spawn near players as before.
    spawnActiveZonesOnly: true
    #Speed multipliers relative to a walker.
    zombieRunnerSpeed: 1.3
    zombieSprinterSpeed: 1.7
    #Each zombie's speed is varied by up to this fraction either way, so a horde never moves in lockstep.
    zombieSpeedVariation: 0.12
    #Time it takes for an arena to start
    arenaStartTime: 60
    #Apply Scope when zooming in if textured
    ZoomTexture: false
    #Change the volume of the round sound
    roundSoundVolume: 0.2
    #Zombie hits that down a player without Juggernog (BO: 2). Set to 0 to use zombieDamage instead.
    zombieHitsToDown: 2
    #Damage of one zombie hit out of 20 hp, only used when zombieHitsToDown is 0.
    zombieDamage: 8
    #A dead player who respawns at the next round keeps their own points (BO). false = respawn with 500 x round.
    respawnKeepsPoints: true
    #Walk-speed multiplier while aiming (sneaking) with a non-sniper gun, on top of the sneak slowdown.
    aimWalkSpeedMultiplier: 0.75
    #Walk-speed multiplier while wading with the feet in water (BO slows you in water). 1 = off.
    waterWalkMultiplier: 0.7
    #Walk-speed multiplier in water up to the waist or deeper. Arenas can override both (water_walk_multiplier / water_deep_walk_multiplier).
    waterDeepWalkMultiplier: 0.5
    #The amount of seconds after being hit to be healed. BO2: ~2.5s short delay then fast regen.
    healTime: 2.5
    #Quick Revive multiplies the heal delay by this (faster regen start).
    quickReviveHealDelayFactor: 0.5
    #Per-zombie attack cooldown in ticks. Each zombie damages a player at most once per this; hits from different zombies STACK (no shared invuln). 20 = ~1s, matching BO2.
    zombieAttackCooldownTicks: 20
    #Bonus points on top of a kill when the killing blow is a headshot (BO: 60 + 40 = 100).
    headshotKillBonus: 40
    #Bonus points on top of a kill when the killing blow is melee/knife (BO: 60 + 70 = 130).
    meleeKillBonus: 70
    #Base knife one-shots zombies through (and including) this round; knife damage derives from the HP curve at this round (BO: 150 damage = round 1 HP).
    knifeOneShotThroughRound: 1
    #Headshot damage multiplier for guns that set no headshot_multiplier in guns.json.
    headshotDamageMultiplier: 1.5
    #Damage (out of 20 HP) a grenade or splash weapon (Ray Gun, launchers) deals to its own user at point blank, falling off with distance. PhD Flopper negates it. 0 disables.
    explosiveSelfDamage: 8.0
    #When a round's zombies are all spawned and exactly one regular zombie remains, turn it into a slow gas-emitting crawler. Off by default: in BO crawlers come from explosions (see crawlerExplosiveChance).
    lastZombieCrawler: false
    #Chance (0-1) that a zombie surviving an explosion (grenades, mines, splash weapons) loses its legs and crawls on, like in BO.
    crawlerExplosiveChance: 0.35
    #Optional health ceiling for a zombie converted into a crawler. 0 = keep its remaining health (BO).
    crawlerHealth: 0
    #Radius (blocks) around a gas crawler within which its toxic gas poisons players.
    crawlerGasRadius: 3.0
    #Chance (0-1) a crawler is a Nova-style gas crawler. Ordinary BO crawlers leave no gas, so 0 by default.
    crawlerGasChance: 0.0
    #Ticks between zombie target refreshes (20 = every second, as in BO).
    zombieRetargetTicks: 20
    #Zombies chase the player with the shortest walking route (Paper pathfinder) instead of the nearest through walls.
    zombiePathTargeting: true
    #Movement-speed multiplier applied to a crawler (1.0 = normal zombie speed, 0.35 = 35% speed). Multiplies the zombie's real base; no slowness potion is stacked on top. Keep below 0.5 or crawlers stop feeling slow.
    crawlerSpeedMultiplier: 0.35
    #Seconds a zombie may make no progress before it teleports to a reachable spawn near a player (fixes stuck/"1 zombie left" hangs). 0 disables.
    zombieStuckSeconds: 6
    #A zombie moving less than this many blocks within a check interval counts as no progress.
    zombieStuckMoveThreshold: 1.0
    #A zombie within this many blocks of a player is attacking, so it is never treated as stuck. Zombies at a boarded window are never stuck either.
    zombieStuckTargetRange: 2.5
    #Flat points awarded to every player by the Bonus Points power-up.
    bonusPointsAmount: 100
    #Maximum throwables (grenades / Monkey Bombs) a player may hold at once (buy-to-cap).
    maxGrenades: 4
    #Lethal grenades every player gets at the start of each round, up to maxGrenades (BO: 2; round 1 is the starting pair). 0 disables.
    grenadesPerRound: 2
    #Dogs spawned per player on the second and later dog rounds (total = dogsPerPlayer * players). BO scales dogs by players, not round.
    dogsPerPlayer: 8
    #Dogs spawned per player on the first dog round of a game.
    dogsPerPlayerFirstRound: 6
    #Hellhounds alive at once, per player (BO: 2).
    dogMaxAlivePerPlayer: 2
    #BO hellhound health on the 1st, 2nd, 3rd, 4th+ dog round (the last entry repeats), in BO health units.
    dogHealthByDogRound: [400, 900, 1300, 1600]
    #Hellhounds appear between these distances (blocks) from the player they hunt, after a lightning strike.
    dogSpawnRadiusMin: 4.0
    dogSpawnRadiusMax: 8.0
    #Ticks between the lightning strike and the hound appearing.
    dogSpawnDelayTicks: 20
    #A dying hound bursts into flame: damage to players within the radius (PhD Flopper is immune).
    dogExplosionDamage: 2.0
    dogExplosionRadius: 2.5
    #Smoke fog around the players during a dog round.
    dogRoundFog: true
    #First dog round is rolled between these rounds (BO2: 5-8); later ones come dogRoundEveryX (+0 or 1) rounds apart.
    dogRoundFirstMin: 5
    dogRoundFirstMax: 8
    #Global default for how often a dog (hellhound) round occurs: a dog round fires every Nth wave (e.g. 5 = every 5th wave). Used as the fallback when an arena's own dog_round_every_x setting is missing/zero/negative, so dog rounds can never be silently disabled by a bad arena value. 0 disables dog rounds globally.
    dogRoundEveryX: 4
    #Guarantee a Max Ammo drop when the last dog of a dog round dies (BO behavior).
    dogRoundMaxAmmoDrop: true
    #Chance (percent) that a normal zombie kill drops a power-up. BO uses ~2% per kill.
    powerUpDropPercentage: 2
    #Maximum power-ups that may drop in a single round (BO caps drops per round ~4). 0 disables the cap.
    maxPowerUpsPerRound: 4
    #Maximum power-ups allowed on the ground at once; oldest is removed beyond this (BO cap ~4).
    maxPowerUpsOnGround: 4
    #Re-picking a timed power-up (Insta-Kill/Double Points/Fire Sale) refreshes/extends its timer (BO behavior).
    powerUpRefreshOnPickup: true
    #Allow re-Pack-a-Punching an already-packed gun for an ammo refill (BO2 behavior).
    packAPunchRepackEnabled: true
    #Point cost to re-Pack-a-Punch a gun for an ammo refill.
    packAPunchRepackCost: 2000
    #Seconds the Pack-a-Punch machine works before the gun is ready (BO2 ~3.5s).
    packAPunchWorkSeconds: 3.5
    #Seconds the upgraded gun waits in the machine before it is lost (BO2 ~15s).
    packAPunchPickupSeconds: 15
    #Seconds Der Wunderfizz cycles through perk bottles before one lands (Origins ~4.5s).
    wunderfizzRollSeconds: 4.5
    #Seconds the rolled perk waits in Der Wunderfizz before it is lost.
    wunderfizzPickupSeconds: 10
    #Uses at one location before a teddy bear can appear and move Der Wunderfizz (needs 2+ machines).
    wunderfizzTeddyMinUses: 3
    #Chance per use, once the minimum is reached, that a teddy bear appears and the machine moves.
    wunderfizzTeddyChance: 0.2
    #Seconds the mystery box spins through weapons.
    boxRollSeconds: 4
    #Seconds the rolled weapon can be taken from the box.
    boxPickupSeconds: 12
    #Uses of a box at one location before the teddy bear can appear and move it.
    boxTeddyMinUses: 3
    #Uses of a box at one location after which the teddy bear is guaranteed (0 = never forced).
    boxTeddyMaxUses: 8
    #Mystery box price during Fire Sale.
    boxFireSaleCost: 10
    #Wall-buy ammo costs gun price / this (BO2: 2). 0 = use the second price on the sign.
    wallAmmoPriceDivisor: 2
    #Wall-buy ammo price when holding the Pack-a-Punched version of the wall gun.
    wallAmmoPackAPunchCost: 4500
    #Ammo crate price for a held gun that is not sold on a wall in this arena (wall guns cost like wall ammo).
    ammoCrateDefaultCost: 1000
    #Ammo crate price when holding a Pack-a-Punched gun.
    ammoCratePackAPunchCost: 4500
    #Seconds the Death Machine power-up minigun is held before it is removed (BO2 ~30s).
    deathMachineDurationSeconds: 30
    #Pack-a-Punch first-pack cost while Bonfire Sale is active (also triggers a Fire Sale). BO2 ~1000.
    bonfirePaPCost: 1000
    #Vulture Aid: percent chance (0-100) that a zombie kill drops a reward for a player holding the perk.
    vultureDropChance: 10
    #Vulture Aid: points awarded when a Vulture Aid drop rolls the points reward (other rolls refill ammo).
    vulturePointsDrop: 25
    #Tier 4 boss rounds: a boss round (George Romero / Brutus, alternating) occurs every Nth wave. 0 disables boss rounds. Takes precedence over dog rounds on shared waves.
    bossRoundEveryX: 0
    #Boss max-health multiplier on top of the normal zombie health curve for the round (clamped so a boss is never weaker than a normal zombie).
    bossHealthMultiplier: 8.0
    #Brutus ability: seconds one of a damaged player's perks is temporarily disabled before being restored.
    brutusDisableSeconds: 5
    #Brutus locks perk machines and mystery boxes he passes within this radius; a player pays brutusUnlockCost to unlock one.
    brutusLockRadius: 3.0
    brutusUnlockCost: 2000
  ReviveSettings:
    ReviveTimer: 4
    ReviveRange: 2
    MaxDownTime: 45
    #Revive every downed player for free at the end of a round. BO does not do this.
    ReviveOnRoundEnd: false
    #Solo self-revive: seconds before Quick Revive auto-revives a lone downed player in a solo game.
    SoloReviveDelaySeconds: 10
  Economy:
    CostPerJoin: 0
    MoneyPerKill: 1
  teleporter:
    #Cooldown/recharge in seconds before a teleporter can be used again.
    cooldownSeconds: 30
    #Charge-up delay in ticks between activating a teleporter and the teleport firing (20 = 1s).
    chargeUpTicks: 40
    #Radius around the teleporter pad in which zombies are killed on activation (0 to disable).
    padKillRadius: 3.0
    #Play a sound when teleporting.
    sound: true
    #Seconds of Pack-a-Punch room access granted when a PaP-flagged teleporter is used (line 2 ends with "pap").
    paPAccessSeconds: 30
  trap:
    #How long (seconds) a triggered trap stays active killing zombies.
    durationSeconds: 10
    #Cooldown (seconds) after a trap finishes before it can be re-triggered.
    cooldownSeconds: 60
    #Defaults for traps without a type or region (older saves). Typed traps use traps.json.
    #Radius (blocks) around the trap sign within which zombies are killed.
    killRadius: 4.0
  quest:
    #Tier 4 easter-egg quest framework. A per-arena multi-step objective engine.
    #Quests are authored entirely via data: a "quest" object in arenas.json plus
    #[Zombies]/Quest signs placed in the world. See QuestManager for the schema.
    #Points granted to every player in the arena when the easter-egg quest completes.
    completionReward: 5000
  wonderWeapons:
    #Thundergun: velocity magnitude applied to each blasted zombie along the shooter's look direction (massive knockback).
    thundergunKnockback: 3.0
    #Wunderwaffe DG-2: max number of additional zombies the lightning chains to after the initial hit (caps the chain).
    wunderwaffeChainCount: 5
    #Wunderwaffe DG-2: radius (blocks) searched for the next nearest un-chained zombie from the last struck one.
    wunderwaffeChainRadius: 6.0
  bank:
    #Tier 3 - percentage fee (0-100) taken off a Bank deposit; the remainder is banked. BO2-style levy. Bank balance persists across games per player UUID.
    depositFeePercent: 10
  barrier:
    #Points awarded per barrier repair level (global, not per-barrier). Total per round is limited by repairPointsRoundCap.
    repairPointsPerLevel: 10
    #Most points one player can earn from repairing boards each round, across all barriers. Black Ops 2 caps this at 50.
    repairPointsRoundCap: 50
    #Issue #70 — ticks between barrier damage stages when a zombie is breaking it. Lower = faster.
    #Scales down by one tick per round above 1, down to breakIntervalMin. Original hard-coded value was 60.
    breakInterval: 60
    breakIntervalMin: 20
    #Issue #130/#96 — how close (in blocks) a zombie must be to a barrier's blocks to start breaking it.
    breakRadius: 3.0
  buildable:
    #Tier 4 - Zombie Shield: number of zombie hits the equipped shield absorbs (reduced/no damage) before it breaks and is consumed.
    zombieShieldHits: 5
    #Tier 4 - Zombie Shield: fraction (0.0-1.0) of zombie melee damage blocked while the shield is held. 1.0 = fully blocks, 0.5 = halves damage.
    zombieShieldDamageReduction: 1.0
    #Tier 4 - Buildable: point cost charged at the station to dispense one random missing part to the interacting player (how players obtain parts).
    partCost: 500
  permaPerks:
    #Master switch for the whole perma-perk system. false = no progress tracked and no effects applied (server-owner off switch).
    enabled: true
    #Tier 4 - Perma-perks: long-term progression. Performing revives across games is tracked per player UUID (persisted in playerdata.json) and permanently unlocks passive bonuses applied at game entry.
    #Perma Jugg (lite): lifetime revives required to unlock. Once unlocked, the player spawns into every game with a short Regeneration burst.
    permaJuggReviveThreshold: 10
    #Perma Jugg (lite): seconds of Regeneration granted at game entry once unlocked.
    permaJuggRegenSeconds: 5
    #Perma Quick Revive (lite): lifetime revives required to unlock. Once unlocked, the player spawns into every game with a short Speed burst to reach downed teammates faster.
    permaQuickReviveThreshold: 15
    #Perma Quick Revive (lite): seconds of Speed granted at game entry once unlocked.
    permaQuickReviveSpeedSeconds: 5
  resourcePack:
    #Custom resource pack: push the COM:Z pack (custom gun/perk/power-up models + sounds) to players when they join a game.
    #Host the pack .zip somewhere players can download it (e.g. a GitHub release asset or web server) and put the direct URL below.
    enabled: false
    #Direct download URL of the pack .zip.
    url: ""
    #40-char hex SHA-1 of the .zip (run `sha1sum pack.zip`). Lets clients cache the pack; leave empty to skip caching (re-downloads every join).
    sha1: ""
    #Force the pack: the client must accept it. With kickOnDecline below, players who refuse are removed from the game.
    force: true
    #Text shown in the client's accept-pack dialog.
    prompt: "Install the Call of Minecraft: Zombies pack for custom guns, perks & sounds"
    #When force is true, remove a player from their game if they decline or fail to download the pack.
    kickOnDecline: false
    #All sound mappings (event sounds, per-power-up, per-gun shoot/reload) live in the separate
    #sounds.json config so they can be tuned in one place. See that file.
  visuals:
    #BO2-fidelity visual feedback layer. Each toggle independently enables/disables one cue; all default true.
    #Ammo / reload readout in the action bar.
    hud: true
    #Red screen-edge vignette while health is low (world border warning).
    lowHealthVignette: true
    #Ambient cues on round change (round-start stinger + brief darkness).
    roundAmbience: true
    #Hit feedback particles (blood / headshot sparkle) and damage pop-up text on zombie hits.
    hitFeedback: true
    #Boss health bar + stinger on boss rounds.
    bossBar: true
    #Vertical locator beam on the Mystery Box.
    boxBeam: true
    #Visual flourish (particle burst + jingle) when buying / receiving a perk.
    perkFeedback: true
    #Visual flourish (title + sound) when Pack-a-Punching a gun.
    papFeedback: true
  features:
    #Alternative interaction layer: instead of clicking world signs, walk up to a door / machine and
    #press F (swap hands) to buy. An action-bar prompt appears when you're in range. Barriers are
    #repaired by holding sneak (always on). Guns still require their wall sign.
    #Show the action-bar prompt + allow F to buy doors / perk machines when nearby.
    proximityBuy: true
    #Keep door [Zombies] price signs visible in the world (classic look). When false, door signs are
    #removed from the world and the door is bought via proximity + F instead.
    useDoorSigns: false
    #Spawn the ephemeral [BarrierRepair] sign on a window when zombies damage it (classic look). When
    #false, no sign is spawned and the barrier is repaired by holding sneak near it instead.
    spawnBarrierRepairSign: false
  environment:
    #Defaults for every arena; each arena can override gravity, jump_boost and fog in /zombies settings.
    #Gravity multiplier: 1.0 = normal, 0.4 = moon. Uses the gravity attribute on 1.20.5+, older servers
    #approximate low gravity with Slow Falling + Jump Boost.
    gravity: 1.0
    #Jump height multiplier.
    jumpBoost: 1.0
    #Darkness/fog around players (needs 1.19+).
    fog: false
    #Seconds of air in a no-air zone without breathing gear before suffocation damage starts.
    oxygenSeconds: 10
    #Damage per second once out of air.
    suffocationDamage: 2.0
    #Show a zone's name as a title when a player enters it.
    zoneTitles: true
    #Helmet materials that always count as breathing gear, e.g. [GLASS]. Items tagged as breathing gear
    #by the plugin always count.
    breathingGearMaterials: []
#Config version marker (read by ConfigSetup; currently informational only).
vID: "2.0"